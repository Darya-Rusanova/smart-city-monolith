services:

  monolith-db:
    image: mysql:8.0
    container_name: monolith-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monolith_db
    ports:
      - "3307:3306"
    volumes:
      - monolith-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck: &db-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  monolith:
    build: .
    container_name: monolith
    restart: on-failure
    ports:
      - "8090:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://monolith-db:3306/monolith_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      monolith-db:
        condition: service_healthy

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3311:3306"
    volumes:
      - auth-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  auth-service:
    build:
      context: https://github.com/Darya-Rusanova/city-infrastructure.git#main:auth-service
    container_name: auth-service
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      auth-db:
        condition: service_healthy

  transport-db:
    image: mysql:8.0
    container_name: transport-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transport_db
    ports:
      - "3312:3306"
    volumes:
      - transport-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  transport-service:
    build:
      context: https://github.com/Darya-Rusanova/city-infrastructure.git#main:transport-service
    container_name: transport-service
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://transport-db:3306/transport_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      transport-db:
        condition: service_healthy

  environment-db:
    image: mysql:8.0
    container_name: environment-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: environment_db
    ports:
      - "3314:3306"
    volumes:
      - environment-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  environment-service:
    build:
      context: https://github.com/Darya-Rusanova/city-infrastructure.git#main:environment-service
    container_name: environment-service
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://environment-db:3306/environment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      environment-db:
        condition: service_healthy

  billing-db:
    image: mysql:8.0
    container_name: billing-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing_db
    ports:
      - "3315:3306"
    volumes:
      - billing-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  billing-service:
    build:
      context: https://github.com/Darya-Rusanova/city-infrastructure.git#main:billing-service
    container_name: billing-service
    restart: on-failure
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://billing-db:3306/billing_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      NOTIFICATION_SERVICE_URL: http://monolith:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Не задан WEBHOOK_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      billing-db:
        condition: service_healthy

  frontend:
    build:
      context: https://github.com/Darya-Rusanova/city-infrastructure.git#main:frontend
    container_name: frontend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      TRANSPORT_SERVICE_URL: http://transport-service:8080
      ENVIRONMENT_SERVICE_URL: http://environment-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      UTILITY_SERVICE_URL: http://monolith:8080
      NOTIFICATION_SERVICE_URL: http://monolith:8080
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Не задан WEBHOOK_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      - auth-service
      - transport-service
      - environment-service
      - billing-service
      - monolith

volumes:
  monolith-data:
  auth-data:
  transport-data:
  environment-data:
  billing-data: